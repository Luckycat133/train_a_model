name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile sources
        run: python -m compileall -q src
      - name: Test CLI contract
        run: pytest -q tests/test_cli_contract.py

  tokenizer-id:
    name: Tokenizer ID and dataset contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            .github/workflows/ci.yml
      - name: Install lightweight dataset test dependencies
        run: python -m pip install -r requirements-ci.txt 'numpy>=2.5.1,<3.0.0'
      - name: Test tokenizer ID and dataset contracts
        run: python -m pytest -q tests/test_tokenizer_id_contract.py
