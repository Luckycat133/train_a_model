name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile sources
        run: python -m compileall -q src
      - name: Test CLI contract
        run: pytest -q tests/test_cli_contract.py

  tokenizer-id:
    name: Tokenizer ID and dataset contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            .github/workflows/ci.yml
      - name: Install lightweight dataset test dependencies
        run: python -m pip install -r requirements-ci.txt 'numpy>=2.5.1,<3.0.0'
      - name: Test tokenizer ID and dataset contracts
        run: python -m pytest -q tests/test_tokenizer_id_contract.py

  cpu-training:
    name: Real CPU training and epoch resume
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt 'numpy>=2.5.1,<3.0.0' 'psutil>=7.2.2' 'tqdm>=4.70.0'
      - name: Run the public smoke, exact epoch resume and checkpoint-loaded CPU SFT
        run: |
          python -m src.run --quick --no_cuda --model_save_dir "${RUNNER_TEMP}/train-smoke"
          python -m pytest -q tests/test_cpu_training.py tests/test_sft_cpu_smoke.py tests/test_mla_cpu.py

      - name: Rebuild and compare the micro MLA benchmark twice
        run: |
          set -euo pipefail
          python -m benchmarks.micro_mla_sft --out "$RUNNER_TEMP/micro-mla-A"
          python -m benchmarks.micro_mla_sft --out "$RUNNER_TEMP/micro-mla-B"
          diff -r "$RUNNER_TEMP/micro-mla-A" "$RUNNER_TEMP/micro-mla-B"
          (cd "$RUNNER_TEMP/micro-mla-A" && sha256sum -c SHA256SUMS)
      - name: Package the verified benchmark
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/micro-mla-delivery"
          name=micro-mla-sft-v0.9.1.tar.gz
          mkdir "$out"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/micro-mla-A" -cf - . | gzip -n > "$out/$name"
          (cd "$out" && sha256sum "$name" > "$name.sha256")
      - name: Upload the benchmark bundle from verified main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: micro-mla-sft-v0.9.1
          path: ${{ runner.temp }}/micro-mla-delivery/*
          if-no-files-found: error
          retention-days: 7
