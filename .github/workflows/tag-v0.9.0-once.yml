name: Create train_a_model v0.9.0 milestone tags once
on:
  push:
    branches: ['dots/tag-v0.9.0-once']
    paths: ['.github/workflows/tag-v0.9.0-once.yml']
permissions: {}
jobs:
  exact-tags:
    if: github.repository == 'Luckycat133/train_a_model'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate source and create only the fixed milestone refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Luckycat133/train_a_model"
          test "$GITHUB_REF" = "refs/heads/dots/tag-v0.9.0-once"
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$main" = "82669b6d1025be113acdb01ad9f8e13a30307b9c"
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$main" --jq .content | base64 --decode > "$RUNNER_TEMP/tag-version.txt"
          grep -Fx '## [0.9.0] - 2026-11-27' "$RUNNER_TEMP/tag-version.txt" >/dev/null
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.1.0" --jq ' .[] | select(.ref == "refs/tags/v0.1.0") | .ref ')"; gh api "repos/$GITHUB_REPOSITORY/git/commits/4e55117624c94aa3bdf14307d87fadaaf19e9e72" --jq .sha | grep -Fx "4e55117624c94aa3bdf14307d87fadaaf19e9e72" >/dev/null
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.8.5" --jq ' .[] | select(.ref == "refs/tags/v0.8.5") | .ref ')"; gh api "repos/$GITHUB_REPOSITORY/git/commits/fd3cb819cacd2bc2b50d1463e48fa7113f8e0f80" --jq .sha | grep -Fx "fd3cb819cacd2bc2b50d1463e48fa7113f8e0f80" >/dev/null
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.9.0" --jq ' .[] | select(.ref == "refs/tags/v0.9.0") | .ref ')"; gh api "repos/$GITHUB_REPOSITORY/git/commits/82669b6d1025be113acdb01ad9f8e13a30307b9c" --jq .sha | grep -Fx "82669b6d1025be113acdb01ad9f8e13a30307b9c" >/dev/null
          test "$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v0.1.0" -f "sha=4e55117624c94aa3bdf14307d87fadaaf19e9e72" --jq .object.sha)" = "4e55117624c94aa3bdf14307d87fadaaf19e9e72"
          test "$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v0.8.5" -f "sha=fd3cb819cacd2bc2b50d1463e48fa7113f8e0f80" --jq .object.sha)" = "fd3cb819cacd2bc2b50d1463e48fa7113f8e0f80"
          test "$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v0.9.0" -f "sha=82669b6d1025be113acdb01ad9f8e13a30307b9c" --jq .object.sha)" = "82669b6d1025be113acdb01ad9f8e13a30307b9c"
